<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apps</title>
  <meta name="description" content="Launcher for my personal web apps">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FEFFEA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2B231A" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="habits/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    /* Launcher: a grid of app tiles built from apps.json. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding:
        calc(env(safe-area-inset-top) + 28px)
        calc(env(safe-area-inset-right) + var(--gutter))
        calc(env(safe-area-inset-bottom) + 28px)
        calc(env(safe-area-inset-left) + var(--gutter));
    }
    h1 { font-size: 24px; margin: 0 0 20px; }
    .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .app {
      display: flex; flex-direction: column; gap: 10px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .app a.main { display: flex; flex-direction: column; gap: 10px; color: inherit; text-decoration: none; }
    .app img { width: 56px; height: 56px; border-radius: 14px; }
    .app .name { font-weight: 650; font-size: 17px; }
    .app .desc { font-size: 13px; color: var(--muted); margin-top: -6px; }
    .app .extra { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; }
    .app .extra a { color: var(--muted); }
    .msg { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Apps</h1>
    <div class="apps" id="apps"><p class="msg">Loading…</p></div>
  </main>

  <script type="module">
    // The app list lives in apps.json, so adding an app never requires editing this page.
    const box = document.getElementById('apps');
    try {
      const res = await fetch('apps.json', { cache: 'no-store' });
      const apps = await res.json();
      box.replaceChildren(...apps.map((app) => {
        const tile = document.createElement('div');
        tile.className = 'app';
        const main = document.createElement('a');
        main.className = 'main';
        main.href = app.path;
        const img = document.createElement('img');
        img.src = app.icon;
        img.alt = '';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = app.name;
        main.append(img, name);
        if (app.description) {
          const desc = document.createElement('div');
          desc.className = 'desc';
          desc.textContent = app.description;
          main.append(desc);
        }
        tile.append(main);
        if (app.links?.length) {
          const extra = document.createElement('div');
          extra.className = 'extra';
          for (const link of app.links) {
            const a = document.createElement('a');
            a.href = link.path;
            a.textContent = link.label;
            extra.append(a);
          }
          tile.append(extra);
        }
        return tile;
      }));
    } catch {
      box.innerHTML = '<p class="msg">Couldn’t load apps.json.</p>';
    }
  </script>
</body>
</html>
